services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iftiin_flow
      POSTGRES_USER: iftiin_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iftiin_flow -d iftiin_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:4321}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      SITE_URL: ${SITE_URL:-http://localhost:4321}
      DATABASE_URL: postgresql://iftiin_flow:${POSTGRES_PASSWORD:-local_development_only}@database:5432/iftiin_flow
    ports:
      - "4321:4321"

volumes:
  postgres_data:
