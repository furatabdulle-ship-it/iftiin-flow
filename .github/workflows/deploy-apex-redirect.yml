name: Deploy apex redirect to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - CNAME
      - index.html
      - 404.html
      - .github/workflows/deploy-apex-redirect.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare redirect site
        run: |
          mkdir -p site
          cp CNAME index.html 404.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
